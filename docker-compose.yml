services:
  api:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: priorseal
      POSTGRES_PASSWORD: development-only-change-me
      POSTGRES_DB: priorseal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priorseal -d priorseal"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
