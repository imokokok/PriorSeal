version: 2
updates:
  # Root workspace: core SDK, workers, and tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Major upgrades are deliberate migrations, not independent automatic
    # bumps: Vite and its React plugin have a peer-version contract, while
    # asn1js and PKI.js must move together or TypeScript sees two incompatible
    # ASN.1 type trees. Keep the tested stack quiet until such a migration is
    # prepared as one branch and validated end to end.
    ignore:
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitejs/plugin-react'
        update-types:
          - version-update:semver-major
      - dependency-name: asn1js
        update-types:
          - version-update:semver-major
      - dependency-name: pkijs
        update-types:
          - version-update:semver-major

  # SBOM tooling.
  - package-ecosystem: npm
    directory: /tools/sbom
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5

  # GitHub Actions used by the release and CI workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
