name: Design-partner pilot
description: Propose a focused PriorSeal integration around one EVM execution path.
title: "pilot: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for exploring PriorSeal. Describe the workflow without including private keys, credentials, confidential transaction metadata, or production database information.
  - type: textarea
    id: workflow
    attributes:
      label: Execution workflow
      description: What does the agent execute, and which system constructs and submits the transaction?
    validations:
      required: true
  - type: input
    id: chain
    attributes:
      label: EVM chain
      placeholder: Base / Ethereum / Arbitrum / chain ID
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Authorization boundary
      description: Which account authorizes the action, and which exact fields must be bound before execution?
    validations:
      required: true
  - type: textarea
    id: consumer
    attributes:
      label: Evidence consumer and success criteria
      description: Who will verify or retain the receipt, and what should a successful pilot demonstrate?
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: I understand that PriorSeal does not construct, sign or submit transactions and does not provide an economic-safety guarantee.
          required: true
