name: SDK release

on:
  push:
    tags: ['sdk-v*']

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish with provenance and attest the artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm >= 11.5.1 is required for Trusted Publishing (OIDC auth, no
      # NODE_AUTH_TOKEN) and for --provenance. The runner's bundled npm is
      # older, so upgrade first and record the version we ended up with.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Install the pinned SBOM generator
        run: npm ci --prefix tools/sbom
      - name: Verify the tag matches the SDK package version and record versions
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#sdk-v}"
          sdk_version="$(node -p "require('./sdk/package.json').version")"
          if [ "$tag_version" != "$sdk_version" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but sdk/package.json is $sdk_version" >&2
            exit 1
          fi
          echo "SDK_VERSION=$sdk_version" >> "$GITHUB_ENV"
      # NOTE: run pack/publish from inside the package directory. `npm
      # --prefix sdk pack|publish` resolves against the repository root in
      # npm 11 (it packed and tried to publish the root Worker package) and
      # breaks the OIDC context (ENEEDAUTH).
      - name: Pack the release tarball
        run: |
          mkdir -p .release-artifacts
          cd sdk
          npm pack --pack-destination ../.release-artifacts
      - name: Generate and validate the SDK SBOM
        run: |
          set -euo pipefail
          sbom="$GITHUB_WORKSPACE/.release-artifacts/priorseal-sdk-${SDK_VERSION}.cdx.json"
          sbom_input="$RUNNER_TEMP/priorseal-sdk-sbom"
          mkdir -p "$sbom_input"
          cp sdk/package.json sdk/package-lock.json "$sbom_input/"
          (
            cd "$sbom_input"
            "$GITHUB_WORKSPACE/tools/sbom/node_modules/.bin/cyclonedx-npm" \
              --package-lock-only \
              --omit dev \
              --output-reproducible \
              --validate \
              --output-format JSON \
              --output-file "$sbom" \
              --mc-type library \
              package.json
          )
          jq -e --arg version "$SDK_VERSION" '
            .bomFormat == "CycloneDX"
            and .specVersion == "1.6"
            and .metadata.component.type == "library"
            and .metadata.component.name == "priorseal-sdk"
            and .metadata.component.version == $version
          ' "$sbom" > /dev/null
      # Provenance requires the npm package.json `repository` field (already
      # present in sdk/package.json) and the npm package settings to list this
      # repo and workflow as a trusted publisher.
      - name: Publish priorseal-sdk to npm with provenance
        run: |
          cd sdk
          npm publish --provenance
      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            .release-artifacts/*.tgz
            .release-artifacts/*.cdx.json
      - name: Create the GitHub release with the npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd .release-artifacts
          for f in *.tgz *.cdx.json; do shasum -a 256 "$f" > "$f.sha256"; done
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "PriorSeal SDK $SDK_VERSION" \
            --notes "PriorSeal SDK $SDK_VERSION is published to npm from GitHub Actions with provenance (Trusted Publishing via OIDC; no long-lived publish token exists). The attached tarball and CycloneDX 1.6 SBOM are generated by this workflow and carry Sigstore build attestations: verify with \`gh attestation verify <file> -R imokokok/PriorSeal\`. Each companion .sha256 asset records its checksum. The SBOM covers the published SDK's production dependency tree resolved from the release commit's lockfile. Install: \`npm install priorseal-sdk@$SDK_VERSION\`." \
            *.tgz *.tgz.sha256 *.cdx.json *.cdx.json.sha256
