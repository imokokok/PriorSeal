name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event name is part of the group so that a `push` run and a
  # `pull_request` run for the same branch never cancel each other. Previously
  # both resolved to the same group (the branch name), so branch pushes
  # cancelled the PR run and left a stale CANCELLED `release-check` that
  # blocked the pull request. Same branch + same event still supersedes, which
  # is the intended fast-feedback behaviour.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: priorseal_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: priorseal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priorseal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RWA_TEST_DATABASE_URL: postgresql://priorseal_test:ci-test-only@127.0.0.1:5432/priorseal_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require repository owner commit identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          owner='imokokok <145034722+imokokok@users.noreply.github.com>'
          bot='dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>'
          # GitHub web merges (squash/rebase/merge) always use this committer for
          # the commit it writes onto main, regardless of the PR author.
          github_committer='GitHub <noreply@github.com>'

          allow_bot=0
          case "$EVENT_NAME" in
            pull_request)
              commits_output="$(git rev-list --reverse "$PR_BASE_SHA..$PR_HEAD_SHA")"
              [[ "$PR_HEAD_REF" == dependabot/* ]] && allow_bot=1
              ;;
            merge_group)
              # The merge-group tip is a synthetic merge commit authored by GitHub;
              # only the candidate PR commits underneath it are gated.
              commits_output="$(git rev-list --reverse --no-merges "$MG_BASE_SHA..$MG_HEAD_SHA")"
              allow_bot=1
              ;;
            push)
              if [[ "$EVENT_BEFORE" == '0000000000000000000000000000000000000000' ]]; then
                commits_output="$(jq -r '.[].id' "$EVENT_PATH")"
              else
                commits_output="$(git rev-list --reverse "$EVENT_BEFORE..$HEAD_SHA")"
              fi
              # Commits landing on main may be squash-merged dependabot bumps.
              allow_bot=1
              ;;
            *)
              commits_output="$HEAD_SHA"
              allow_bot=1
              ;;
          esac

          if [[ -n "$commits_output" ]]; then mapfile -t commits <<< "$commits_output"; else commits=(); fi

          for commit in "${commits[@]}"; do
            [[ -z "$commit" ]] && continue
            identity="$(git show -s --format='%an <%ae>|%cn <%ce>' "$commit")"
            author="${identity%%|*}"
            committer="${identity##*|}"

            author_ok=0
            [[ "$author" == "$owner" ]] && author_ok=1
            [[ $allow_bot -eq 1 && "$author" == "$bot" ]] && author_ok=1

            committer_ok=0
            [[ "$committer" == "$owner" || "$committer" == "$github_committer" ]] && committer_ok=1

            if [[ $author_ok -ne 1 || $committer_ok -ne 1 ]]; then
              echo "::error::Commit $commit has author '$author' / committer '$committer'; expected the repository owner${allow_bot:+ (or dependabot[bot])} as author and the owner or GitHub as committer."
              exit 1
            fi
          done

          echo "Validated ${#commits[@]} commit(s) against the repository identity policy."
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/aps-priorseal-decision-binding-v1/package-lock.json
      - name: Install root and maintenance example dependencies
        run: |
          npm ci
          npm ci --prefix examples/aps-priorseal-decision-binding-v1 --ignore-scripts
      - name: Check the documented offline receipt example
        run: |
          npm run example:receipt
          npm run verify:receipt
      - name: Run non-browser release gates
        run: npm run release:check:pre-browser
      - name: Verify APS producer inputs and adapter boundaries
        run: npm run test:aps-priorseal
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser release gate
        run: npm run test:e2e:prepared
      - name: RWA v2 durable authorization and receipt workflow (simulation)
        run: npm run rwa:verify:prepared
      - name: Install isolated execution drill dependency
        run: npm install --prefix "$RUNNER_TEMP/local-evm" --ignore-scripts --no-audit --no-fund ganache@7.9.2
      - name: Exercise local execution and database recovery
        env:
          GANACHE_MODULE: ${{ runner.temp }}/local-evm/node_modules/ganache/dist/node/core.js
        run: node scripts/local-execution-drill.mjs
      - name: Exercise the RWA signer boundary against local token transfers
        env:
          GANACHE_MODULE: ${{ runner.temp }}/local-evm/node_modules/ganache/dist/node/core.js
        run: node scripts/rwa-local-execution-drill.mjs
