name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: priorseal_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: priorseal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priorseal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RWA_TEST_DATABASE_URL: postgresql://priorseal_test:ci-test-only@127.0.0.1:5432/priorseal_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/aps-priorseal-decision-binding-v1/package-lock.json
      - name: Install root and maintenance example dependencies
        run: |
          npm ci
          npm ci --prefix examples/aps-priorseal-decision-binding-v1 --ignore-scripts
      - name: Check the documented offline receipt example
        run: |
          npm run example:receipt
          npm run verify:receipt
      - name: Run non-browser release gates
        run: npm run release:check:pre-browser
      - name: Verify APS producer inputs and adapter boundaries
        run: npm run test:aps-priorseal
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser release gate
        run: npm run test:e2e:prepared
      - name: RWA v2 durable authorization and receipt workflow (simulation)
        run: npm run rwa:verify:prepared
      - name: Install isolated execution drill dependency
        run: npm install --prefix "$RUNNER_TEMP/local-evm" --ignore-scripts --no-audit --no-fund ganache@7.9.2
      - name: Exercise local execution and database recovery
        env:
          GANACHE_MODULE: ${{ runner.temp }}/local-evm/node_modules/ganache/dist/node/core.js
        run: node scripts/local-execution-drill.mjs
      - name: Exercise the RWA signer boundary against local token transfers
        env:
          GANACHE_MODULE: ${{ runner.temp }}/local-evm/node_modules/ganache/dist/node/core.js
        run: node scripts/rwa-local-execution-drill.mjs
