name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run release gate
        run: npm run release:check
      - name: Install isolated execution drill dependency
        run: npm install --prefix "$RUNNER_TEMP/local-evm" --ignore-scripts --no-audit --no-fund ganache@7.9.2
      - name: Exercise local execution and database recovery
        env:
          GANACHE_MODULE: ${{ runner.temp }}/local-evm/node_modules/ganache/dist/node/core.js
        run: node scripts/local-execution-drill.mjs
