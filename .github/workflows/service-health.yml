name: Public service health

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-service-health
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    # Five concurrent reads with 30-second timeouts, one-minute confirmation delay, then a full retry.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check portfolio and Agent-retail public surfaces; confirm failures after one minute
        shell: bash
        run: |
          if node scripts/integration-doctor.mjs > health-portfolio-first.json \
            && node scripts/agent-retail-readiness.mjs > health-agent-retail-first.json; then
            exit 0
          fi
          sleep 60
          portfolio_status=0
          agent_retail_status=0
          node scripts/integration-doctor.mjs > health-portfolio-confirmation.json || portfolio_status=$?
          node scripts/agent-retail-readiness.mjs > health-agent-retail-confirmation.json || agent_retail_status=$?
          if [ "$portfolio_status" -ne 0 ] || [ "$agent_retail_status" -ne 0 ]; then
            exit 1
          fi
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-service-health
          path: health-*.json
          retention-days: 14
