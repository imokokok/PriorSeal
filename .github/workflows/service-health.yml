name: Public service health

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-service-health
  cancel-in-progress: false

jobs:
  portfolio-readiness:
    runs-on: ubuntu-latest
    # Five concurrent reads with 30-second timeouts, one-minute confirmation delay, then a full retry.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check portfolio public surfaces; confirm failures after one minute
        shell: bash
        run: |
          if node scripts/integration-doctor.mjs > health-portfolio-first.json; then
            exit 0
          fi
          sleep 60
          node scripts/integration-doctor.mjs > health-portfolio-confirmation.json
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-portfolio-health
          path: health-portfolio-*.json
          retention-days: 14

  agent-retail-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check Agent-retail public surfaces; confirm failures after one minute
        shell: bash
        run: |
          if node scripts/agent-retail-readiness.mjs > health-agent-retail-first.json; then
            exit 0
          fi
          sleep 60
          node scripts/agent-retail-readiness.mjs > health-agent-retail-confirmation.json
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-agent-retail-health
          path: health-agent-retail-*.json
          retention-days: 14
